import groovy.json.JsonOutput
import java.lang.management.ManagementFactory

// Initialization evidence avoids execution-time task-graph listeners, which
// conflict with configuration-cache builds. No caching feature is disabled.
println 'GRADLE_GATE_PROFILE_JSON:' + JsonOutput.toJson([
    max_workers: gradle.startParameter.maxWorkerCount,
    parallel: gradle.startParameter.parallelProjectExecutionEnabled,
    gradle_jvmargs: ManagementFactory.runtimeMXBean.inputArguments,
    gradle_max_heap_bytes: Runtime.runtime.maxMemory()
])

gradle.projectsEvaluated { build ->
    def collectAllFailures = System.getenv('GRADLE_GATE_COLLECT_ALL_FAILURES') == 'true'
    build.rootProject.allprojects.each { project ->
        project.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { task ->
            task.maxParallelForks = 1
            task.failFast = !collectAllFailures
            task.ignoreFailures = false
            // Real test lifecycle output supports owner diagnostics, including
            // configuration-cache reuse. It never decides cancellation.
            task.testLogging.events = task.testLogging.events + [
                org.gradle.api.tasks.testing.logging.TestLogEvent.STARTED,
                org.gradle.api.tasks.testing.logging.TestLogEvent.PASSED,
                org.gradle.api.tasks.testing.logging.TestLogEvent.SKIPPED,
                org.gradle.api.tasks.testing.logging.TestLogEvent.FAILED
            ]
            if (!task.maxHeapSize) task.maxHeapSize = '512m'
            println 'GRADLE_GATE_TEST_PROFILE_JSON:' + JsonOutput.toJson([
                path: task.path, max_parallel_forks: task.maxParallelForks,
                max_heap: task.maxHeapSize, fail_fast: task.failFast,
                ignore_failures: task.ignoreFailures, observation_phase: 'configuration'
            ])
        }
    }
}
