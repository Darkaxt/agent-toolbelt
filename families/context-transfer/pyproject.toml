[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toolbelt-context-transfer"
version = "0.1.0"
description = "Destination-owned Codex task-tree handoff, recovery archive, and transactional retirement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darkaxt" }]
dependencies = []

[project.scripts]
agent-toolbelt-context-transfer = "agent_toolbelt_context_transfer.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
