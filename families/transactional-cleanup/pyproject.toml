[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toolbelt-transactional-cleanup"
version = "0.1.0"
description = "Reviewed snapshot cleanup with Windows file identity and deletion tickets"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-toolbelt-transactional-cleanup = "agent_toolbelt_transactional_cleanup.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
