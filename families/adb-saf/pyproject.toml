[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toolbelt-adb-saf"
version = "0.1.0"
description = "Android documents-provider (Storage Access Framework) access over ADB with reviewed, verified changes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darkaxt" }]
dependencies = []

[project.scripts]
agent-toolbelt-adb-saf = "agent_toolbelt_adb_saf.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_toolbelt_adb_saf = ["assets/*"]
